<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGLS Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#050816,#0f172a,#1e3a8a);
color:white;
}

.card{
width:400px;
padding:40px;
border-radius:20px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
box-shadow:0 0 30px rgba(59,130,246,.5);
}

h1{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:10px;
}

button{
width:100%;
padding:15px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#1d4ed8;
}
</style>
</head>

<body>

<div class="card">

<h1>Login</h1>

<form id="loginForm">

<input type="text" placeholder="Username" required>

<input type="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e){

e.preventDefault();

const data = {
username: document.querySelectorAll("input")[0].value,
password: document.querySelectorAll("input")[1].value
};

const response = await fetch("/api/auth/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body: JSON.stringify(data)
});

const result = await response.json();

if(response.ok){

localStorage.setItem("token", result.data.token);

alert("Login Successful!");

window.location.href="/dashboard";

}else{

alert(result.message || "Invalid Username or Password");

}

});
</script>

</body>
</html>
