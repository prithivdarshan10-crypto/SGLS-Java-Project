<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGLS Register</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#050816,#0f172a,#1e3a8a);
color:white;
}

.card{
width:420px;
padding:40px;
border-radius:20px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
box-shadow:0 0 30px rgba(59,130,246,.5);
}

h1{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:10px;
}

button{
width:100%;
padding:15px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#1d4ed8;
}
</style>
</head>

<body>

<div class="card">

<h1>Create Account</h1>

<form id="registerForm">

<input type="text" placeholder="Full Name" required>

<input type="text" placeholder="Username" required>

<input type="email" placeholder="Email" required>

<input type="password" placeholder="Password" required>

<input type="password" placeholder="Confirm Password" required>

<button type="submit">Register</button>

</form>

</div>

<script>
document.getElementById("registerForm").addEventListener("submit", async function(e){

e.preventDefault();

const data = {
fullName: document.querySelectorAll("input")[0].value,
username: document.querySelectorAll("input")[1].value,
email: document.querySelectorAll("input")[2].value,
password: document.querySelectorAll("input")[3].value,
role: "EMPLOYEE"
};

const response = await fetch("/api/auth/register",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body: JSON.stringify(data)
});

const result = await response.json();

if(response.ok){
alert("Registration Successful!");
window.location.href="/login";
}else{
alert(result.message || "Registration Failed");
}

});
</script>

</body>
</html>
