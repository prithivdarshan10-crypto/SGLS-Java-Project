<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGLS Login Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#050816;
overflow:hidden;
color:white;
}

body::before{
content:'';
position:fixed;
width:200%;
height:200%;
background:
radial-gradient(circle,#60a5fa33 1px,transparent 1px);
background-size:50px 50px;
animation:stars 35s linear infinite;
z-index:-2;
}

@keyframes stars{
from{transform:translateY(0);}
to{transform:translateY(-800px);}
}

.login-card{
width:430px;
padding:40px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,0.1);
border-radius:25px;
box-shadow:0 0 40px rgba(37,99,235,.4);
}

.logo{
text-align:center;
font-size:34px;
font-weight:700;
color:#60a5fa;
margin-bottom:15px;
}

h1{
text-align:center;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#cbd5e1;
margin-bottom:25px;
}

input{
width:100%;
padding:15px;
margin:12px 0;
border:none;
outline:none;
border-radius:12px;
background:rgba(255,255,255,0.1);
color:white;
font-size:15px;
}

input::placeholder{
color:#cbd5e1;
}

button{
width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-3px);
box-shadow:0 0 25px rgba(37,99,235,.6);
}

.register-link{
text-align:center;
margin-top:20px;
}

.register-link a{
color:#60a5fa;
text-decoration:none;
}

.toast{
position:fixed;
bottom:20px;
right:20px;
background:#2563eb;
padding:15px 20px;
border-radius:10px;
display:none;
}

</style>
</head>

<body>

<div class="login-card">

<div class="logo">🚚 SGLS</div>

<h1>Login Portal</h1>

<p class="subtitle">
Smart Global Logistics System
</p>

<form id="loginForm">

<input type="text" placeholder="Username" required>

<input type="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

<div class="register-link">
Don't have an account?
<a href="/register">Register</a>
</div>

</div>

<div class="toast" id="toast"></div>

<script>

function showToast(message){

const toast=document.getElementById("toast");

toast.innerHTML=message;

toast.style.display="block";

setTimeout(()=>{
toast.style.display="none";
},3000);

}

document.getElementById("loginForm")
.addEventListener("submit", async function(e){

e.preventDefault();

const data = {
username: document.querySelectorAll("input")[0].value,
password: document.querySelectorAll("input")[1].value
};

try{

const response = await fetch("/api/auth/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(data)
});

const result = await response.json();

if(response.ok){

localStorage.setItem("token",result.data.token);
localStorage.setItem("username",result.data.username);
localStorage.setItem("role",result.data.role);

showToast("🚀 Login Successful");

setTimeout(()=>{
window.location.href="/dashboard";
},1000);

}else{

showToast(result.message || "Invalid Username or Password");

}

}catch(error){

showToast("Server Error");

}

});

</script>

</body>
</html>
