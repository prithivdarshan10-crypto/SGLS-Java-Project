# ================================================================
# APPLICATION IDENTITY
# ================================================================
spring.application.name=Smart Global Logistics System

# ================================================================
# DATASOURCE — MySQL connection
# In production (Render), these values are OVERRIDDEN by
# environment variables set in the Render dashboard.
# We use ${ENV_VAR:default} syntax: right side is local dev default.
# ================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sgls_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool tuning
# max-pool-size: max simultaneous DB connections
# connection-timeout: how long to wait before throwing an error
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# ================================================================
# JPA / HIBERNATE
# ================================================================
# ddl-auto options:
#   create       — drops and creates tables on every start (dev only)
#   update       — adds/alters columns but never drops (staging)
#   validate     — just checks schema matches entities (production)
#   none         — do nothing (production with Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Prevents N+1 queries on lazy collections — logs a warning instead of erroring
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# ================================================================
# JWT SECURITY
# ================================================================
# secret: must be at least 256 bits (32 chars) for HS256
# In production, override via RENDER environment variable
app.jwt.secret=${JWT_SECRET:SGLSSecretKey2024VeryLongAndSecureForProduction}
# expiration in milliseconds: 86400000 = 24 hours
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ================================================================
# SERVER
# ================================================================
server.port=${PORT:8080}
# Shows the full error message in responses (disable in production)
server.error.include-message=always
server.error.include-binding-errors=always

# ================================================================
# THYMELEAF
# ================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ================================================================
# LOGGING
# ================================================================
logging.level.com.sgls=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
